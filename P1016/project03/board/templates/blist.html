<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판 목록</title>
</head>
<style>
    table,th,td{border: 1px solid black; border-collapse: collapse}
    th,td{width: 150px; height: 40px;}
    img{width: 100px;}
</style>
<body>
    <h1>게시판 목록</h1>
    <table>
        <tr>
            <th>제목</th>
            <th>이미지이름</th>
            <th>보기</th>
        </tr>
        {% for board in list %}
        <tr>
            <td>{{board.btitle}}</td>
            <td>{{board.bfile}}</td>
            <td><img src={{board.bfile.url}}></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
